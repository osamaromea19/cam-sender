<!DOCTYPE html>
<html>
<head>
    <title>Camera Sender</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            text-align: center;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            min-height: 100vh;
            margin: 0;
        }
        .container {
            background: rgba(255, 255, 255, 0.1);
            padding: 30px;
            border-radius: 15px;
            backdrop-filter: blur(10px);
            max-width: 500px;
            margin: 0 auto;
        }
        video {
            width: 100%;
            max-width: 300px;
            border: 3px solid white;
            border-radius: 10px;
            margin: 20px 0;
            background: black;
        }
        button {
            padding: 12px 24px;
            margin: 10px;
            font-size: 16px;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            background: #4CAF50;
            color: white;
            transition: all 0.3s;
        }
        button:hover {
            background: #45a049;
            transform: scale(1.05);
        }
        button:disabled {
            background: #cccccc;
            cursor: not-allowed;
        }
        .status {
            padding: 15px;
            margin: 15px 0;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 8px;
            font-size: 14px;
        }
        .info {
            font-size: 12px;
            opacity: 0.8;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📷 Camera Sender</h1>
        <p>This site captures camera feed and sends to receiver</p>
        
        <video id="webcam" autoplay muted playsinline></video>
        <canvas id="canvas" style="display: none;"></canvas>
        
        <div class="status" id="status">Ready to start</div>
        
        <div>
            <button onclick="startCamera()" id="startBtn">Start Camera</button>
            <button onclick="startSending()" id="sendBtn" disabled>Start Sending</button>
            <button onclick="stopEverything()" id="stopBtn" disabled>Stop Everything</button>
        </div>
        
        <div class="info">
            <p>Receiver: <strong>cam-receiver.vercel.app</strong></p>
            <p>Frames sent: <span id="frameCount">0</span></p>
            <p>Last sent: <span id="lastSent">Never</span></p>
        </div>
    </div>

    <script>
        // Configuration - USING YOUR ACTUAL RECEIVER URL
        const RECEIVER_URL = "https://cam-receiver.vercel.app";
        
        let currentStream = null;
        let isSending = false;
        let sendInterval;
        let frameCount = 0;
        let receiverWindow = null;
        
        function updateStatus(message, isError = false) {
            const status = document.getElementById('status');
            status.textContent = message;
            status.style.background = isError ? 'rgba(255, 0, 0, 0.3)' : 'rgba(0, 0, 0, 0.3)';
        }
        
        function updateLastSent() {
            document.getElementById('lastSent').textContent = new Date().toLocaleTimeString();
        }
        
        async function startCamera() {
            try {
                stopEverything();
                
                updateStatus("Requesting camera access...");
                
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { width: 640, height: 480 }
                });
                
                currentStream = stream;
                const video = document.getElementById('webcam');
                video.srcObject = stream;
                
                updateStatus("Camera active! Click 'Start Sending'");
                document.getElementById('startBtn').disabled = true;
                document.getElementById('sendBtn').disabled = false;
                
            } catch (error) {
                updateStatus("Camera error: " + error.message, true);
            }
        }
        
        function startSending() {
            if (!currentStream) {
                updateStatus("Start camera first!", true);
                return;
            }
            
            isSending = true;
            frameCount = 0;
            updateStatus("Sending frames to receiver...");
            
            // Open receiver window first
            receiverWindow = window.open(RECEIVER_URL, 'receiverWindow', 'width=600,height=800');
            
            // Start sending frames every 3 seconds
            sendInterval = setInterval(sendFrame, 3000);
            
            document.getElementById('sendBtn').disabled = true;
            document.getElementById('stopBtn').disabled = false;
            
            // Send first frame immediately
            setTimeout(sendFrame, 1000);
        }
        
        function sendFrame() {
            if (!isSending || !currentStream) return;
            
            const video = document.getElementById('webcam');
            const canvas = document.getElementById('canvas');
            const context = canvas.getContext('2d');
            
            // Set canvas size to match video
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            
            // Capture frame
            context.drawImage(video, 0, 0, canvas.width, canvas.height);
            
            // Convert to data URL
            const imageData = canvas.toDataURL('image/jpeg', 0.7);
            
            // Send to receiver
            sendToReceiver(imageData);
            
            frameCount++;
            document.getElementById('frameCount').textContent = frameCount;
            updateLastSent();
        }
        
        function sendToReceiver(imageData) {
            // Method 1: Update the receiver window if it's open
            if (receiverWindow && !receiverWindow.closed) {
                try {
                    receiverWindow.postMessage({
                        type: 'newImage',
                        image: imageData,
                        timestamp: Date.now(),
                        frameNumber: frameCount
                    }, RECEIVER_URL);
                } catch (error) {
                    console.log('Window communication error:', error);
                }
            }
            
            // Method 2: Also use URL method as backup
            const newWindow = window.open(`${RECEIVER_URL}?image=${encodeURIComponent(imageData)}&frame=${frameCount}&time=${Date.now()}`, '_blank');
            
            // Close the backup window after a moment
            setTimeout(() => {
                if (newWindow && !newWindow.closed) {
                    newWindow.close();
                }
            }, 1000);
        }
        
        function stopEverything() {
            isSending = false;
            clearInterval(sendInterval);
            
            if (currentStream) {
                currentStream.getTracks().forEach(track => track.stop());
                currentStream = null;
            }
            
            document.getElementById('webcam').srcObject = null;
            document.getElementById('startBtn').disabled = false;
            document.getElementById('sendBtn').disabled = true;
            document.getElementById('stopBtn').disabled = true;
            
            updateStatus("Stopped");
        }
        
        // Clean up on page unload
        window.addEventListener('beforeunload', stopEverything);
    </script>
</body>
</html>
